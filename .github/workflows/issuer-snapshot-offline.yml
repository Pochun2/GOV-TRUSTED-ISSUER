name: Issuer snapshot and replay tests (offline)
on:
  pull_request:
permissions:
  contents: read
jobs:
  issuer-snapshot-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline synthetic snapshot and replay tests
        run: python -B -m unittest discover -s tests -p test_issuer_snapshot_gate.py -v
      - name: Scope boundary
        run: echo 'NO_GITHUB_API_READ NO_APP_KEY NO_CHECK_RUN NO_LLM_CALL GATE_A_BLOCKED'
