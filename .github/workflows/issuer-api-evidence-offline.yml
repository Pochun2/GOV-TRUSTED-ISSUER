name: Issuer API evidence contract tests (offline)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  issuer-api-evidence-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No-network synthetic API evidence tests
        run: python -B -m unittest discover -s tests -p test_github_api_evidence.py -v
      - name: No attestation
        run: echo 'NO_TOKEN NO_APP_KEY NO_CHECK_RUN NO_MERGE GATE_A_BLOCKED'
